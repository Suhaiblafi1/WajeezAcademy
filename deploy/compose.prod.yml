# منظومة الإنتاج على خادمٍ واحد: Postgres · خادم وجيز · Caddy.
#
# الاستعمال من جذر المستودع على الخادم:
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.production up -d
# أو ببساطة: bash deploy/deploy.sh
#
# ثلاثة قرارات مقصودة هنا:
#   ١) قاعدة البيانات لا تنشر منفذا إلى المضيف. تصل إليها الحاويات عبر شبكة
#      Docker الخاصة باسمها `db`. وقاعدةٌ منشورةٌ على 5432 تُمسح بالماسحات
#      الآلية خلال ساعات — وهي تحمل سجلّات الدفع.
#   ٢) الخادم كذلك لا ينشر منفذا. Caddy وحده يواجه الإنترنت.
#   ٣) الأحجام مسمّاة لا مسارات مضيف: نسخُها واسترجاعها بأمر واحد،
#      ولا تعتمد على أذونات مستخدمٍ على المضيف.

name: wajeez

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?اضبط POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اضبط POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?اضبط POSTGRES_DB}
      # الترتيب والترميز صراحةً: العربية تُفرز خطأ على locale افتراضي مختلف
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # لا ports: — القاعدة لا تُرى من خارج شبكة Docker

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # يُشتقّ من بيانات القاعدة أعلاه فلا يُكتب مرتين ولا يفترقان
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_HOST: 0.0.0.0
      API_PORT: "7101"
      NODE_ENV: production
      # ‏NODE_ENV يحرس أربعةَ أبوابٍ (رمزُ الاستعادة في جسم الاستجابة · راية
      # ‏`secure` للكعكة · توثيقُ Swagger · تحذيرُ STORAGE_SECRET). وهو مضبوطٌ
      # هنا منذ اليوم الأوّل، فلم يكن أيٌّ منها مفتوحا على هذا الخادم قطّ.
      #
      # و`APP_ENV` اسمٌ محايدُ المضيف أُضيف في #26 خلَفا لـ`VERCEL_ENV` الذي
      # زال. حارسُ الديمو يقبل الاثنين، فـ`NODE_ENV` يكفيه هنا — ويُضبط هذا
      # معه صراحةً لأنّ حارسا أعمى لا يُخطئ بل يفتح بابا بصمت.
      APP_ENV: production
    volumes:
      - storage:/app/storage        # الملفات الخاصة — تبقى بين الإصدارات
      - web:/srv/web                # الواجهة المبنية، يقرؤها Caddy
    # لا ports: — Caddy وحده يواجه الإنترنت

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"             # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?اضبط SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?اضبط ACME_EMAIL — تنبيهات انتهاء الشهادة تصلك عليه}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web:/srv/web:ro
      - caddy_data:/data           # الشهادات — لا تحذف هذا الحجم أبدا
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  web:
  caddy_data:
  caddy_config:
