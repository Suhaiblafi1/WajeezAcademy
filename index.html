<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />
    <script>
      /* المظهر قبل أول رسم — بلا وميض: داكن دائما عند كل فتح، واختيار «الفاتح»
         يعيش للزيارة الحالية فقط (sessionStorage). المفتاح القديم في
         localStorage لم يعد مستخدما — يُزال مرة واحدة */
      try {
        localStorage.removeItem("wajeez_theme");
        if (sessionStorage.getItem("wajeez_theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- الهوية والوصف الافتراضيان — كل صفحة تحدّثهما عبر SeoHead -->
    <title>أكاديمية وجيز — مسارك يبدأ من فهمك</title>
    <meta name="description" content="أكاديمية وجيز — تشخيص تعليمي ذكي يفهم هدفك وواقعك، ثم يرسم لك مسارا واحدا مفسّرا بمدربين حقيقيين ومخرج عملي يثبت جاهزيتك." />
    <!-- الأصل يُحقن وقت البناء: %VITE_SITE_ORIGIN% — النطاق النهائي في الإنتاج،
         ونطاق النشرة في الفترة التجريبية. الوسوم الساكنة هي ما تقرؤه بوتات
         المعاينة (واتساب/تويتر) وزاحف الفهرسة، فهي لا تنتظر React.
         المصدر: src/application/site/origin.ts وscripts/vercel-build.sh -->
    <link rel="canonical" href="%VITE_SITE_ORIGIN%/" />

    <!-- المشاركة الاجتماعية -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="أكاديمية وجيز" />
    <meta property="og:title" content="أكاديمية وجيز — مسارك يبدأ من فهمك" />
    <meta property="og:description" content="تشخيص ذكي يفهمك، مسار واحد مفسّر، ومخرج عملي يثبت جاهزيتك — من مجموعة وجيز." />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%/" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شعار أكاديمية وجيز" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="أكاديمية وجيز — مسارك يبدأ من فهمك" />
    <meta name="twitter:description" content="تشخيص ذكي يفهمك، مسار واحد مفسّر، ومخرج عملي يثبت جاهزيتك." />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%/og-image.png" />

    <!-- بيانات منظمة: المنظمة + الموقع + الأسئلة الشائعة الظاهرة فعليا في الصفحة -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "أكاديمية وجيز",
          "alternateName": "Wajeez Academy",
          "url": "%VITE_SITE_ORIGIN%/",
          "parentOrganization": { "@type": "Organization", "name": "وجيز", "url": "https://wajeez.com" },
          "email": "Academy@wajeez.co",
          "address": { "@type": "PostalAddress", "addressLocality": "الرياض — حي الياسمين — شارع أنس بن مالك", "addressCountry": "SA" }
        },
        {
          "@type": "WebSite",
          "name": "أكاديمية وجيز",
          "url": "%VITE_SITE_ORIGIN%/",
          "inLanguage": "ar"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            { "@type": "Question", "name": "هل التشخيص اختبار نفسي؟", "acceptedAnswer": { "@type": "Answer", "text": "لا. هو أداة فهم تعليمية تسألك عن هدفك وواقعك وأسلوبك ثم تترجم إجاباتك إلى توصية مسار مفسّرة — لا تشخيص نفسيا ولا طبيا." } },
            { "@type": "Question", "name": "ماذا يشمل سعر المسار؟", "acceptedAnswer": { "@type": "Answer", "text": "الدورات حسب مسارك، دورة إضافية مجانية، ملخصات كتب وجيز الصوتية واختباراتها، مرافقة المدرب والمستشار، الواجبات المقيمة بشريا، مشروع التخرج، وشهادة الإتمام الموثقة — السعر كاملا في صفحة مسارك قبل أي دفع." } },
            { "@type": "Question", "name": "كيف أعرف أن المسار مناسب لي فعلا؟", "acceptedAnswer": { "@type": "Answer", "text": "كل توصية تأتي مع سببها ودرجة ثقتها، وعند انخفاض الثقة نحوّلك لمستشار بشري قبل أي دفع." } },
            { "@type": "Question", "name": "هل تضمنون وظيفة أو دخلا بعد المسار؟", "acceptedAnswer": { "@type": "Answer", "text": "لا. نضمن مسارا مدروسا ومهارات قابلة للقياس ومشاريع حقيقية تثبت جاهزيتك — ولا نعد بوظيفة أو دخل." } },
            { "@type": "Question", "name": "ماذا لو بدأت ولم يناسبني المسار؟", "acceptedAnswer": { "@type": "Answer", "text": "تبديل الدورات قبل بدئها مجاني، وسياسة الاسترداد مكتوبة كاملة في صفحة سياسة الاسترداد قبل أن تدفع." } }
          ]
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
