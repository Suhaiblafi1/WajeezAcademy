    <script>
      /* المظهر قبل أول رسم — بلا وميض: داكن دائما عند كل فتح، واختيار «الفاتح»
         يعيش للزيارة الحالية فقط (sessionStorage). المفتاح القديم في
         localStorage لم يعد مستخدما — يُزال مرة واحدة */
      try {
        localStorage.removeItem("wajeez_theme");
        if (sessionStorage.getItem("wajeez_theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>

    <script>
      /* شبكة أمان: صفحةٌ مخزّنة تطلب حزمةً حُذفت بعد نشرٍ جديد.

         كلُّ نشرٍ يُغيّر بصمة ملفّ الحزمة (‏index-<hash>.js‏) ويحذف القديم.
         وindex.html يُخدَّم بـmust-revalidate، أي على المتصفّح أن يسأل الخادم
         قبل استعماله — لكنّ استعادة تبويبٍ أو الرجوع للخلف يتجاوز ذلك في
         بعض المتصفّحات، وSafari خاصّةً. فتُستعمل صفحةٌ قديمة تطلب أصلا صار
         ٤٠٤، فلا تُنفَّذ الحزمة، فتبقى الشاشة بيضاء صامتة.

         ولا يمكن أن يكون الإنقاذ في الحزمة: هي التي لم تصل. فهو هنا، سطورا
         قليلةً تُشحن مع كلّ صفحة.

         وثلاثة قيود تمنعه من أن يصير عطبا في نفسه:
         · مرّةً واحدةً لكلّ تبويب — العلامة في sessionStorage قبل النداء، فلا
           حلقةَ تحميلٍ لا تنتهي إن كان الخادم نفسه معطوبا.
         · أصولُنا وحدها (‏/assets/‏) — لا يُعيد التحميل لخطّ فشل أو صورةٍ من
           مصدرٍ خارجيّ.
         · بلا تخزينٍ متاح (تصفّحٌ خفيّ صارم) لا يُعيد التحميل أبدا: عجزُنا عن
           عدّ المحاولات يجعل الحلقة ممكنة، وشاشةٌ بيضاء أهون من تبويبٍ يدور. */
      (function () {
        var KEY = "wajeez_stale_reload_at";
        var COOLDOWN = 60000; // مللي ثانية

        /* التطبيق يحمّل صفحاته تكاسليّا — ١٢٩ قطعة — وكلّ نشرٍ يحذف القديمة.
           فصفحةٌ مخزّنة في متصفّح الزائر تطلب قطعةً صارت ٤٠٤.

           وهنا الفخّ الذي أوقعني: فشلُ `import()` الديناميكيّ **لا يُطلق حدث
           error** على عنصر — يرفض وعدا. فحارسٌ يسمع `error` وحده يرى إخفاق
           الحزمة الرئيسة ولا يرى إخفاق القطع. تُقلع الصفحة سليمةً ثمّ تنهار
           عند أوّل انتقال، فيبدو أنّ «الموقع لا يعمل» بعد كلّ نشر.

           فالمسامع ثلاثة لمصادر الإخفاق الثلاثة، وبابُ الإعادة واحد:
           · error         — الحزمة الرئيسة أو ورقة نمط
           · vite:preloadError — إخفاق تحميل قطعةٍ مؤجَّلة (يُطلقه Vite)
           · unhandledrejection — شبكة أمانٍ لما تفلته الأولان

           والحدّ زمنيّ لا «مرّةً واحدة»: نافذةُ دقيقة لا يمسحها إقلاع. كان
           المسحُ عند الإقلاع يصنع حلقةً — إقلاعٌ ← مسحٌ ← فشلٌ ← إعادة — وقد
           وقعت فعلا. فإن كان النقص عابرا شُفيت الصفحة بإعادةٍ واحدة، وإن كان
           مقيما بقيت كما هي ولم يدُر التبويب. */
        /* بلا تخزينٍ متاح: علامةٌ في العنوان بدل لا شيء.

           كان الحارس يمتنع عن الإعادة كليّا حين يُمنع التخزين — بحجّةٍ صحيحة:
           عدّادٌ في الذاكرة يُمحى بإعادة التحميل نفسِها، فتصير الحلقة ممكنة.
           لكنّ الأثر أنّ من يفعّل «حظر كل ملفات تعريف الارتباط» في سفاري —
           أو يتصفّح خفيّا بصرامة — يبقى على شاشةٍ بيضاء بلا علاج.

           والعلامةُ في العنوان تحلّ الاثنين: تبقى بعد إعادة التحميل (فتمنع
           الحلقة)، ولا تحتاج تخزينا. فالإعادةُ واحدةٌ لا أكثر: إن شُفيت
           الصفحة فقد شُفيت، وإن كان العطب مقيما بقيت كما هي ولم يدُر التبويب. */
        var URL_MARK = "_wr";

        function markedInUrl() {
          try {
            return String(location.search || "").indexOf(URL_MARK + "=1") !== -1;
          } catch (e) {
            return true;                                   // تعذّر القراءة: لا نُعيد
          }
        }

        function reloadWithMark() {
          try {
            var u = new URL(location.href);
            u.searchParams.set(URL_MARK, "1");
            location.replace(u.toString());
          } catch (e) {
            location.reload();
          }
        }

        /* هل يُسمح بإعادةٍ الآن؟ ومَن يُعيد: التخزين أم العنوان */
        var reloadVia = "storage";

        function mayReload() {
          try {
            var last = parseInt(sessionStorage.getItem(KEY) || "0", 10);
            if (last && Date.now() - last < COOLDOWN) return false;
            sessionStorage.setItem(KEY, String(Date.now()));
            reloadVia = "storage";
            return true;
          } catch (e) {
            /* لا تخزين — نلجأ إلى العنوان، وإعادةٌ واحدة لا غير */
            if (markedInUrl()) return false;
            reloadVia = "url";
            return true;
          }
        }

        /* بابُ الإعادة الواحد — يعرف بأيّ وسيلةٍ أُذن له */
        function doReload() {
          if (reloadVia === "url") reloadWithMark();
          else location.reload();
        }

        function isStaleChunkMessage(text) {
          if (!text) return false;
          return text.indexOf("dynamically imported module") !== -1
            || text.indexOf("Importing a module script failed") !== -1
            || text.indexOf("error loading dynamically imported module") !== -1;
        }

        /* ١) الحزمة الرئيسة أو ورقة نمط — طور الالتقاط: فشلُ المورد لا يصعد */
        window.addEventListener("error", function (event) {
          var el = event.target;
          if (!el || el === window) return;                // خطأ شيفرةٍ لا فشلُ مورد
          if (el.tagName !== "SCRIPT" && el.tagName !== "LINK") return;
          var src = el.src || el.href || "";
          if (src.indexOf("/assets/") === -1) return;      // حزمُنا وحدها
          if (mayReload()) doReload();
        }, true);

        /* ٢) قطعةٌ مؤجَّلة أخفقت — يمنعه Vite من الانفجار إن مُنع افتراضُه */
        window.addEventListener("vite:preloadError", function (event) {
          if (!mayReload()) return;
          if (event.preventDefault) event.preventDefault();
          doReload();
        });

        /* ٣) شبكة أمان: رفضٌ غير ملتقَط نصُّه يدلّ على قطعةٍ زائلة */
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          var text = reason && (reason.message || String(reason));
          if (!isStaleChunkMessage(text)) return;
          if (mayReload()) doReload();
        });
      })();
    </script>
