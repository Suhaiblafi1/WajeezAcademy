    <meta name="theme-color" content="#0D0D0D" />
    <script>
      /* المظهر قبل أول رسم — بلا وميض: داكن دائما عند كل فتح، واختيار «الفاتح»
         يعيش للزيارة الحالية فقط (sessionStorage). المفتاح القديم في
         localStorage لم يعد مستخدما — يُزال مرة واحدة */
      try {
        localStorage.removeItem("wajeez_theme");
        if (sessionStorage.getItem("wajeez_theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      /* شبكة أمان: صفحةٌ مخزّنة تطلب حزمةً حُذفت بعد نشرٍ جديد.

         كلُّ نشرٍ يُغيّر بصمة ملفّ الحزمة (‏index-<hash>.js‏) ويحذف القديم.
         وindex.html يُخدَّم بـmust-revalidate، أي على المتصفّح أن يسأل الخادم
         قبل استعماله — لكنّ استعادة تبويبٍ أو الرجوع للخلف يتجاوز ذلك في
         بعض المتصفّحات، وSafari خاصّةً. فتُستعمل صفحةٌ قديمة تطلب أصلا صار
         ٤٠٤، فلا تُنفَّذ الحزمة، فتبقى الشاشة بيضاء صامتة.

         ولا يمكن أن يكون الإنقاذ في الحزمة: هي التي لم تصل. فهو هنا، سطورا
         قليلةً تُشحن مع كلّ صفحة.

         وثلاثة قيود تمنعه من أن يصير عطبا في نفسه:
         · مرّةً واحدةً لكلّ تبويب — العلامة في sessionStorage قبل النداء، فلا
           حلقةَ تحميلٍ لا تنتهي إن كان الخادم نفسه معطوبا.
         · أصولُنا وحدها (‏/assets/‏) — لا يُعيد التحميل لخطّ فشل أو صورةٍ من
           مصدرٍ خارجيّ.
         · بلا تخزينٍ متاح (تصفّحٌ خفيّ صارم) لا يُعيد التحميل أبدا: عجزُنا عن
           عدّ المحاولات يجعل الحلقة ممكنة، وشاشةٌ بيضاء أهون من تبويبٍ يدور. */
      (function () {
        var KEY = "wajeez_stale_reload";
        /* الحزمة تنادي هذه عند إقلاعها — وصولُها يعني ألّا حاجة للحارس */
        window.__wajeezBooted = function () {
          try { sessionStorage.removeItem(KEY); } catch (e) { /* بلا تخزين */ }
        };
        window.addEventListener("error", function (event) {
          var el = event.target;
          if (!el || el === window) return;               // خطأ شيفرةٍ لا فشلُ مورد
          if (el.tagName !== "SCRIPT" && el.tagName !== "LINK") return;
          var src = el.src || el.href || "";
          if (src.indexOf("/assets/") === -1) return;     // حزمُنا وحدها
          try {
            if (sessionStorage.getItem(KEY)) return;      // أُعيد مرّةً — يكفي
            sessionStorage.setItem(KEY, "1");
          } catch (e) { return; }
          location.reload();
        }, true);                                          // الالتقاط: فشلُ المورد لا يصعد
      })();
    </script>

    <!-- الهوية والوصف الافتراضيان — كل صفحة تحدّثهما عبر SeoHead -->

            { "@type": "Question", "name": "هل تضمنون وظيفة أو دخلا بعد المسار؟", "acceptedAnswer": { "@type": "Answer", "text": "لا. نضمن مسارا مدروسا ومهارات قابلة للقياس ومشاريع حقيقية تثبت جاهزيتك — ولا نعد بوظيفة أو دخل." } },
            { "@type": "Question", "name": "ماذا لو بدأت ولم يناسبني المسار؟", "acceptedAnswer": { "@type": "Answer", "text": "تبديل الدورات قبل بدئها مجاني، وسياسة الاسترداد مكتوبة كاملة في صفحة سياسة الاسترداد قبل أن تدفع." } }
