# النشر إلى الخادم — بعد أن تخضرّ البوابات، لا قبلها.
#
# لماذا ملفٌ مستقلّ لا وظيفة في ci.yml: النشر يحتاج `environment` وأسرارا
# لا تُمنح لبناءات الفروع ولا لطلبات السحب من نُسَخ خارجية. وفصلُه يجعل
# صلاحيةَ الوصول إلى الخادم معلّقةً بملفٍّ واحدٍ يُقرأ في سطرين.
#
# الأسرار المطلوبة في: Settings ← Secrets ← Actions
#   SSH_HOST         عنوان الخادم
#   SSH_USER         مستخدمٌ في مجموعة docker (لا root)
#   SSH_KEY          مفتاح خاص بلا عبارة مرور، عامّه في authorized_keys
#   SSH_KNOWN_HOSTS  ناتج: ssh-keyscan -H <العنوان>

name: Deploy

# التشغيل يدويّ وحده اليوم — بقصد.
#
# كان يعمل تلقائيا بعد كل نجاح لـCI على main، فيحمرّ في كل مرّة: الموقع على
# Vercel ولا خادم ذاتيّ بعد، فأسرار SSH غير مضبوطة. وعلامةُ خطأٍ حمراء تتكرّر
# بلا سبب حقيقيّ أسوأ من غياب الفحص: تعلّم القارئ تجاهل الأحمر، فيمرّ الأحمر
# الحقيقيّ بينها بلا أن يُرى.
#
# فحين يجهز الخادم الذاتيّ وتُضبط الأسرار، يُعاد سطرا `workflow_run` أدناه.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false      # لا يُقطع نشرٌ في منتصفه أبدا

jobs:
  deploy:
    # الشرط هو كلّ الحماية: لا نشر إلا من main وبعد نجاح CI كاملة
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: تهيئة مفتاح SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # المضيف المعروف صراحةً — لا StrictHostKeyChecking=no:
          # تعطيلُه يقبل أيّ خادمٍ يجيب، وهو بابُ اعتراضٍ في الطريق
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: النشر
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'cd /opt/wajeez && bash deploy/deploy.sh'

      - name: تنظيف المفتاح
        if: always()
        run: rm -f ~/.ssh/id_ed25519
