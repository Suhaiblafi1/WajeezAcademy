# النشر إلى الإنتاج — بعد أن تخضرّ البوابات، لا قبلها.
#
# ── لماذا أُعيد هذا الملفّ، وما الذي تغيّر فيه ──
#
# حُذف في ٦ سبتمبر ٢٠٢٦ بحجّةٍ صحيحةٍ في وقتها: كان يَنشُر إلى التصميم الذاتيّ
# (Docker + Caddy على خادمٍ مستقلّ) عبر `bash deploy/deploy.sh` — وذاك التصميمُ
# لم يُستعمل في الإنتاج قطّ، وحُذف معه. فبقي المستودَع **بلا نشرٍ آليٍّ إطلاقا**،
# وصارت كلُّ نشرةٍ سبعةَ أوامرَ يكتبها إنسانٌ بيده، ومنها واحدٌ إن نُسي لم
# يتغيّر الـAPI أبدا — وقد نُسي فعلا ورُصد أثرُه.
#
# فأُعيد **مصوَّبا على البيئة الحقيقيّة**: Cloudways، لا التصميمَ المحذوف. وما
# يُشغَّل هو `scripts/deploy-cloudways.sh` في المستودَع نفسِه — يقرؤه المراجع،
# ويشغّله هذا الملفّ، ويشغّله من يفتح SSH بيده. لا نسختان تفترقان.
#
# ── وثلاثةُ فروقٍ عن الملفّ المحذوف ──
#
# ①  **فحصٌ مسبَقٌ يسمّي ما ينقص.** التشغيلان الأخيران للملفّ القديم فشلا في
#    ثمانِ ثوانٍ بلا سببٍ مقروء — أسرارٌ غيرُ مضبوطة، والرسالةُ لا تقول ذلك.
#    فصار أوّلُ ما يجري فحصا يطبع بالضبط أيُّ سرٍّ ناقصٌ وأين يُضاف.
#
# ②  **تحقّقٌ بعد النشر.** النشرةُ لا تُعلَن ناجحةً لأنّ الأوامرَ رجعت بصفر، بل
#    لأنّ `‎/api/version` على النطاق الحيّ يعلن الالتزامَ الذي نُشر. وهذا يُغلق
#    بعينه العطبَ الذي وقع: واجهةٌ تتحدّث وAPI يبقى قديما.
#
# ③  **لا `deploy/deploy.sh`** — ذاك ملفُّ التصميم المحذوف.
#
# ── الأسرارُ والمتغيّراتُ المطلوبة ──
#
#   Settings ← Secrets and variables ← Actions ← Secrets
#     SSH_HOST         عنوان خادم Cloudways
#     SSH_USER         مستخدمُ التطبيق (لا master إن أمكن)
#     SSH_KEY          مفتاحٌ خاصٌّ بلا عبارة مرور، عامُّه في authorized_keys
#     SSH_KNOWN_HOSTS  ناتج: ssh-keyscan -H <العنوان>
#
#   Settings ← Secrets and variables ← Actions ← Variables
#     APP_PATH         مسارُ المستودَع على الخادم — مثل
#                      /home/master/applications/<التطبيق>/public_html
#     SITE_URL         اختياريّ — الافتراض https://www.wajeezacademy.com

name: Deploy

# التشغيل تلقائيّ بعد خضرة CI على main — بقرارٍ من صاحب المنصّة (٥ سبتمبر ٢٠٢٦).
# و`workflow_dispatch` يبقى إلى جانبه: نشرةٌ يدويّةٌ عند الحاجة (إعادةُ نشرٍ بلا
# تغييرٍ في الشيفرة، أو تجاوزُ فشلٍ عابر) لا تُلغي التلقائيّ.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false      # لا يُقطع نشرٌ في منتصفه أبدا

jobs:
  deploy:
    # الشرط هو كلّ الحماية: لا نشر إلا من main وبعد نجاح CI كاملة
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      # ① لا يُبدأ نشرٌ ينقصه شيء — والرسالةُ تسمّي الناقصَ لا ترمز إليه
      - name: فحصٌ مسبَق — هل الأسرارُ مضبوطة؟
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_PATH: ${{ vars.APP_PATH }}
        run: |
          missing=()
          [ -n "$SSH_HOST" ]        || missing+=("SSH_HOST (سرّ) — عنوان خادم Cloudways")
          [ -n "$SSH_USER" ]        || missing+=("SSH_USER (سرّ) — مستخدم التطبيق")
          [ -n "$SSH_KEY" ]         || missing+=("SSH_KEY (سرّ) — المفتاح الخاص")
          [ -n "$SSH_KNOWN_HOSTS" ] || missing+=("SSH_KNOWN_HOSTS (سرّ) — ناتج ssh-keyscan -H <العنوان>")
          [ -n "$APP_PATH" ]        || missing+=("APP_PATH (متغيّر) — مسار المستودَع على الخادم")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=إعدادُ النشر ناقص::لم تُضبط ${#missing[@]} قيمة — النشرُ لم يبدأ أصلا"
            echo ""
            echo "الناقص:"
            printf '  · %s\n' "${missing[@]}"
            echo ""
            echo "موضعُها: Settings ← Secrets and variables ← Actions"
            echo "وحتّى تُضبط، يبقى النشرُ يدويّا: راجع docs/DEPLOYMENT.md §٢"
            exit 1
          fi
          echo "✔ الإعدادُ كامل"

      - name: تهيئةُ مفتاح SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # المضيفُ المعروفُ صراحةً — لا StrictHostKeyChecking=no:
          # تعطيلُه يقبل أيَّ خادمٍ يجيب، وهو بابُ اعتراضٍ في الطريق
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ② ما يُشغَّل هو سكربتُ المستودَع نفسِه — لا أمرٌ مكتوبٌ هنا وحدَه
      - name: النشر
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd '${{ vars.APP_PATH }}' && bash scripts/deploy-cloudways.sh"

      # ③ النشرةُ تُعلَن ناجحةً حين يقولها الخادمُ الحيّ، لا حين ترجع الأوامرُ بصفر
      - name: تحقُّقٌ — هل وصلت النشرةُ إلى الـAPI فعلا؟
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.wajeezacademy.com' }}
        run: |
          # مهلةٌ قصيرة: عمليّةُ Node تحتاج ثوانيَ بعد إعادة التشغيل
          for i in 1 2 3 4 5 6; do
            sleep 5
            body="$(curl -fsS --max-time 20 "$SITE_URL/api/version" || true)"
            [ -n "$body" ] && break
          done
          if [ -z "$body" ]; then
            echo "::error title=تعذّر الوصول إلى /api/version::النشرُ جرى ولم يُتحقَّق منه — افحص $SITE_URL/api/version بنفسك"
            exit 1
          fi
          echo "$body"
          live="$(printf '%s' "$body" | grep -o '"الالتزام":"[0-9a-f]\{7\}"' | head -1 | grep -o '[0-9a-f]\{7\}' || true)"
          echo ""
          echo "الالتزامُ العاملُ على الإنتاج: ${live:-مجهول}"
          if [ -z "$live" ]; then
            echo "::warning title=بلا ختم التزام::الـAPI يعمل ولا يعلن التزامَه — راجع خطوة ختم البناء"
          fi

      - name: تنظيفُ المفتاح
        if: always()
        run: rm -f ~/.ssh/id_ed25519
