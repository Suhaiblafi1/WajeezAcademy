# تكامل مستمر لأكاديمية وجيز (البند ب-٣).
#
# لماذا هذا الملف موجود: كان في المستودع ٣٧٠ اختبارا وخط أساس تشخيصي ملتزم،
# ولا شيء يشغّلهما تلقائيا. شبكةُ أمان تعتمد على أن يتذكّرها إنسان ليست شبكة.
#
# وظيفتان بقصد:
#   fast   — بلا قاعدة بيانات: أنواع · دين تلويم · اختبارات المتصفح · خط أساس
#            المحرك · بناء. تعطي جوابا في دقائق فتُقرأ فعلا.
#   server — بقاعدة PostgreSQL مدمجة: اختبارات الخادم بالتسلسل، لأنها تعيد بناء
#            قاعدة الاختبار في كل ملف فتتصادم لو تُشغّل متوازية.

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # لا حاجة لمتصفحات Playwright في CI — التقاط الشاشات يدوي
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  fast:
    name: أنواع · تلويم · اختبارات · خط الأساس · بناء
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: توليد عميل Prisma
        # الأنواع في server/ تعتمد عليه — ولا يحتاج قاعدة بيانات
        run: npx prisma generate

      - name: فحص الأنواع — تطبيق المتصفح
        # ⚠ tsconfig.json ملف حلّ بمراجع فقط: فحصه لا يفحص شيئا.
        #    لهذا يُشار إلى الملفين صراحة.
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: فحص الأنواع — الخادم والسكربتات
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: بوابة دين التلويم
        # تفشل عند دين جديد لا عند الدين القائم — التفصيل في السكربت
        run: npx tsx scripts/lint-baseline.ts

      - name: اختبارات المتصفح والمحرك
        run: npx vitest run src/tests

      - name: بوابة التحقق المصدرية للكتالوج
        # ترفض قبل أي كتابة: مهارة بخطأ إملائي · مسار بلا جمهور · دورة وهمية
        run: npx tsx scripts/validate-catalog-source.ts

      - name: خط أساس رحلات التشخيص
        # يفشل إن خالف التشغيل الحيّ الملف الملتزم بلا تحديثه في الطلب نفسه
        run: npx tsx scripts/v2_1/sim-journeys.ts --check

      - name: تغطية القياس لا تتراجع
        # موجة ٦ · أ-٤: يقيس الاتجاه لا القيمة — يفشل عند التراجع فقط،
        # فحاجزٌ يفشل على الحال القائم يُعتاد تجاهله.
        run: npm run ci:coverage-baseline

      - name: التراكبات المولّدة لا تنحرف عن مولّدها
        # ج-٢: الملفات تقول «مولَّدة — لا تُحرر يدويًا» وهذا ما يفرضه.
        # يكشف تحريرا يدويا، أو تغييرا في المولّد بلا إعادة توليد والتزام.
        run: npm run ci:overlays

      - name: فضاء التوصيات الموحد سليم
        # يرفض كيانا معتمدا يطلب حقيقة لا يستطيع تدفق B2C إنتاجها — وهو ما
        # يُسقط كيانات كاملة من المنافسة بصمت.
        run: npm run audit:recommendation-universe

      - name: هدر مقاعد الأسئلة لا ينمو
        # قياس مضاد للواقع على 300 جلسة: مقعدٌ لا يغيّر أيُّ جواب فيه المسارَ
        # ولا الثقة = وقتٌ أُخذ من المتعلم بلا مقابل. يفشل عند نمو الهدر أو عند
        # موت سؤال كان حيّا.
        #
        # كانت هذه البوابة والتي قبلها معرَّفتين في package.json وموثقتين في
        # المراجعات بوصفهما من «البوابات السبع» — وليستا في هذا الملف. فمرّ إلى
        # main خطُّ أساسٍ قديم (3604/401) بينما التشغيل الحيّ 3523/410، ولم
        # يُمسك لأن أحدا لم يكن يشغّلهما إلا يدويا.
        run: npm run ci:question-waste

      - name: حزمةُ الخادم مطابقةٌ للشيفرة
        # `api/index.js` هو الخادمُ الذي يعمل على الإنتاج، وهو ملفٌّ متتبَّعٌ
        # لا يُبنى عند النشر — يجب أن يُعاد بناؤه بيدٍ قبل كلّ دفعة. ولا شيءَ
        # كان يذكّر بذلك، فبلي مرّتين: في الثانية بقي «بريدٌ مقابل كود الخصم»
        # و«عمولتي» للمستشار ميّتين على الموقع الحيّ — الواجهةُ منشورةٌ لأنّ
        # Vercel يبنيها كلَّ نشر، والمسارُ غيرُ موجود، والشيفرةُ سليمةٌ فلا
        # شيءَ يُنبّه. وهذا صنفُ عطبٍ لا تكشفه اختباراتٌ ولا مراجعة.
        run: npm run ci:bundle

      - name: بناء الإنتاج
        run: npm run build

      - name: فحص الإتاحة على الصفحات العامة
        # موجة ٦ · ب: خطة التجربة قالت «ت-٤ لم يُفحص بعد… ولا أدّعي أنها فُحصت».
        # هذا يفحصه على كل دفع: اسمٌ مقروء لكل عنصر تفاعلي · حلقة تركيز مرئية على
        # كل محطة Tab · منطقة main واحدة · ترتيب العناوين · انسياب عند ٢٠٠٪ و٤٠٠٪.
        # المجموعة العامة وحدها هنا: لا تحتاج قاعدة ولا حسابات، والانحدار يُمسك.
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 3000 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          npm run ci:a11y

  server:
    name: اختبارات الخادم بقاعدة حقيقية
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: توليد عميل Prisma
        run: npx prisma generate

      - name: اختبارات الخادم
        # test:e2e يحمل --no-file-parallelism أصلا: كل ملف يعيد بناء قاعدة
        # الاختبار، فالتوازي يجعلها تتصادم. مصدر واحد للأمر لا اثنان.
        run: npm run test:e2e
